# ===================================================================
# Shopping Service - Local Development Profile
# ===================================================================

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/local/shopping-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/local/shopping-service/

  # Spring Cloud AWS 설정 (LocalStack 연결)
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566
      secretsmanager:
        endpoint: http://localhost:4566
      parameterstore:
        endpoint: http://localhost:4566

  datasource:
    url: jdbc:postgresql://localhost:5432/shopping_db
    username: ${db.username:laze}
    password: ${db.password:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:18081

  # JWT 검증은 API Gateway에서 수행, 이 서비스는 X-User-Id 헤더로 인증 정보 수신

server:
  forward-headers-strategy: framework

app:
  frontend:
    base-url: http://localhost:30000

# Feign Client 설정
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
  blog-service:
    url: "http://localhost:8082"
  shopping-seller-service:
    url: "http://localhost:8088"

# Swagger 설정 (Local 환경: 활성화)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Local Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,env,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.portal.universe.shoppingservice.event.EventBridgePublisher: DEBUG
