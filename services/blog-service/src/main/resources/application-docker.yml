# ===================================================================
# Blog Service - Docker Compose Profile
# ===================================================================

server:
  forward-headers-strategy: framework

app:
  frontend:
    base-url: https://portal-shell:30000

# 서비스 URL 정의 (Docker DNS)
services:
  gateway:
    url: "http://api-gateway:8080"
  auth:
    url: "http://auth-service:8081"
  blog:
    url: "http://blog-service:8082"
  shopping:
    url: "http://shopping-service:8083"
  notification:
    url: "http://notification-service:8084"

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/docker/blog-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/docker/blog-service/

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localstack:4566
      secretsmanager:
        endpoint: http://localstack:4566
      parameterstore:
        endpoint: http://localstack:4566

  data:
    mongodb:
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/blog_db?authSource=admin

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: blog-group
    properties:
      schema.registry.url: http://schema-registry:8081

  # JWT 검증은 API Gateway에서 수행, 이 서비스는 X-User-Id 헤더로 인증 정보 수신

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      location: ${java.io.tmpdir}

feign:
  auth-service:
    url: http://auth-service:8081

# Swagger 설정 (Docker 환경: 활성화, 개발 환경)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Docker 환경 모니터링 설정
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
    tags:
      application: ${spring.application.name}
      environment: docker

logging:
  level:
    root: INFO
    com.portal.universe: INFO
    # 노이즈 억제
    org.springframework.data.mongodb: WARN

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:test}
    secret-key: ${AWS_S3_SECRET_KEY:test}
    bucket-name: blog-bucket
    region: ap-northeast-2
    endpoint: http://localstack:4566
