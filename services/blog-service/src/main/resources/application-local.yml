# ===================================================================
# Blog Service - Local Development Profile
# ===================================================================

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/local/blog-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/local/blog-service/

  # Spring Cloud AWS 설정 (LocalStack 연결)
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566
      secretsmanager:
        endpoint: http://localhost:4566
      parameterstore:
        endpoint: http://localhost:4566

  data:
    mongodb:
      uri: mongodb://${db.username:laze}:${db.password:${MONGO_PASSWORD}}@localhost:27017/blog_db?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:18081

  # JWT 검증은 API Gateway에서 수행, 이 서비스는 X-User-Id 헤더로 인증 정보 수신

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      location: ${java.io.tmpdir}

server:
  forward-headers-strategy: framework

app:
  frontend:
    base-url: http://localhost:30000

# 서비스 URL 정의 (IntelliJ 개발용 - localhost)
services:
  gateway:
    url: "http://localhost:8080"
  auth:
    url: "http://localhost:8081"
  blog:
    url: "http://localhost:8082"
  shopping:
    url: "http://localhost:8083"
  notification:
    url: "http://localhost:8084"

# Swagger 설정 (Local 환경: 활성화)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Local Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,env,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO

aws:
  s3:
    access-key: test
    secret-key: test
    bucket-name: blog-bucket
    region: ap-northeast-2
    endpoint: http://localhost:4566
