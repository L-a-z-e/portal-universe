# ===================================================================
# Notification Service - Local Development Profile
# ===================================================================

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/local/notification-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/local/notification-service/

  # Spring Cloud AWS 설정 (LocalStack 연결)
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566
      secretsmanager:
        endpoint: http://localhost:4566
      parameterstore:
        endpoint: http://localhost:4566

  datasource:
    url: jdbc:mysql://localhost:3307/notification_db?useSSL=false&allowPublicKeyRetrieval=true
    username: ${db.username:${DB_USER:laze}}
    password: ${db.password:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
    properties:
      schema.registry.url: http://localhost:18081

server:
  forward-headers-strategy: framework

app:
  frontend:
    base-url: http://localhost:30000
  websocket:
    allowed-origins: "*"

# Local Actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health,env,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
