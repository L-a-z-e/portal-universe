# ===================================================================
# Drive Service - Kubernetes Profile
# ===================================================================

server:
  forward-headers-strategy: framework

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/k8s/drive-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/k8s/drive-service/

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localstack:4566
      secretsmanager:
        endpoint: http://localstack:4566
      parameterstore:
        endpoint: http://localstack:4566

  datasource:
    url: jdbc:postgresql://postgresql:5432/drive_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: kafka:29092
    properties:
      schema:
        registry:
          url: http://schema-registry:8081

# Swagger (Kubernetes: disabled)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Kubernetes Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      liveness:
        enabled: true
      readiness:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}
      environment: kubernetes

app:
  kafka:
    topic:
      replicas: 3

logging:
  level:
    root: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
