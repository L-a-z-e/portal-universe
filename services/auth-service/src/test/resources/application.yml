# ===================================================================
# Spring Boot Test Configuration for Auth Service
# ===================================================================

server:
  port: 0  # 랜덤 포트 사용 (테스트 병렬 실행 지원)

spring:
  application:
    name: auth-service

  # ===================================================================
  # Config Server 및 Discovery 비활성화
  # ===================================================================
  config:
    import: optional:file:./  # 외부 설정 임포트 비활성화
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  # ===================================================================
  # DataSource 설정 (Testcontainers에서 동적으로 오버라이드)
  # ===================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  # ===================================================================
  # Flyway (통합 테스트에서 Testcontainers 오버라이드)
  # ===================================================================
  flyway:
    enabled: false

  # ===================================================================
  # JPA/Hibernate 설정
  # ===================================================================
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===================================================================
  # OAuth2 Authorization Server 설정
  # ===================================================================
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8081

  # ===================================================================
  # Kafka 설정 (테스트용 - 실제 연결 없이 동작)
  # ===================================================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

# ===================================================================
# Logging 설정
# ===================================================================
logging:
  level:
    com.portal.universe.authservice: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.test: DEBUG
