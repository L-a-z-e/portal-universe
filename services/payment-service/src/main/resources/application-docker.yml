# ===================================================================
# Payment Service - Docker Compose Profile
# ===================================================================

server:
  forward-headers-strategy: framework

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/docker/payment-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/docker/payment-service/

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localstack:4566
      secretsmanager:
        endpoint: http://localstack:4566
      parameterstore:
        endpoint: http://localstack:4566

  datasource:
    url: jdbc:postgresql://postgresql:5432/payment_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: kafka:29092
    properties:
      schema.registry.url: http://schema-registry:8081

# Swagger (Docker: enabled)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Docker monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
    tags:
      application: ${spring.application.name}
      environment: docker

logging:
  level:
    root: INFO
    com.portal.universe: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN
