# ===================================================================
# Payment Service - Local Development Profile
# ===================================================================

spring:
  config:
    import:
      - optional:aws-secretsmanager:/portal-universe/local/payment-service/db-credentials?prefix=db.
      - optional:aws-parameterstore:/portal-universe/local/payment-service/

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566
      secretsmanager:
        endpoint: http://localhost:4566
      parameterstore:
        endpoint: http://localhost:4566

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: ${db.username:laze}
    password: ${db.password:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:18081

server:
  forward-headers-strategy: framework

# Swagger (Local: enabled)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Local Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,env,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
