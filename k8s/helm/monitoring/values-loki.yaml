# =================================================================
# loki-stack Helm Values
# Loki (로그 수집) + Promtail (로그 전송)
#
# 사용법:
#   helm upgrade --install loki grafana/loki-stack \
#     -n portal-universe \
#     -f k8s/helm/monitoring/values-loki.yaml
# =================================================================

loki:
  # 서비스 이름을 "loki"로 고정 (Grafana datasource URL과 일치)
  fullnameOverride: "loki"
  image:
    tag: 2.9.0
  # Kind에서는 emptyDir 사용 (영구 저장소 불필요)
  persistence:
    enabled: false
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  config:
    auth_enabled: false
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h

grafana:
  sidecar:
    datasources:
      enabled: false

promtail:
  enabled: true
  fullnameOverride: "promtail"
  image:
    tag: 2.9.0
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    snippets:
      # portal-universe 네임스페이스 로그만 수집
      pipelineStages:
        - docker: {}
        - match:
            selector: '{namespace="portal-universe"}'
            stages:
              - regex:
                  expression: '.*'
