# ===================================================================
# MongoDB: PersistentVolumeClaim (PVC)
# 역할: MongoDB 데이터의 영구 저장을 위한 동적 볼륨을 요청합니다.
# ===================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: portal-universe
spec:
  # ReadWriteOnce: 단일 노드에서만 볼륨을 마운트할 수 있도록 설정합니다.
  accessModes:
    - ReadWriteOnce
  # 5Gi 크기의 저장 공간을 요청합니다.
  resources:
    requests:
      storage: 5Gi

# ===================================================================
# MongoDB: Replica Set KeyFile Secret
# 역할: Replica Set 멤버 간 인증에 사용되는 키 파일입니다.
# ===================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-keyfile
  namespace: portal-universe
type: Opaque
data:
  replica-keyfile: 

# ===================================================================
# MongoDB: Deployment
# 역할: MongoDB 서버를 Replica Set 모드로 실행하는 Pod를 정의하고 관리합니다.
# ===================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: portal-universe
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # keyFile 권한을 600으로 설정 (MongoDB 필수 요구사항)
      initContainers:
        - name: fix-keyfile-permissions
          image: mongo:8.0
          command: ["sh", "-c", "cp /tmp/keyfile/replica-keyfile /etc/mongo/replica-keyfile && chmod 600 /etc/mongo/replica-keyfile && chown 999:999 /etc/mongo/replica-keyfile"]
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/keyfile
              readOnly: true
            - name: keyfile-volume
              mountPath: /etc/mongo
      containers:
        - name: mongodb
          image: mongo:8.0
          # Replica Set 모드 + keyFile 인증 (Docker compose와 동일)
          args: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/replica-keyfile"]
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "laze"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-universe-secret
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "blog_db"
          # Replica Set 초기화 + 상태 확인 (Docker healthcheck과 동일 패턴)
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  mongosh --quiet
                  -u "$MONGO_INITDB_ROOT_USERNAME"
                  -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok }"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  mongosh --quiet
                  -u "$MONGO_INITDB_ROOT_USERNAME"
                  -p "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval "db.runCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
            - name: keyfile-volume
              mountPath: /etc/mongo
              readOnly: true
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
        - name: keyfile-secret
          secret:
            secretName: mongodb-keyfile
        - name: keyfile-volume
          emptyDir: {}

# ===================================================================
# MongoDB: Service
# 역할: 클러스터 내 다른 서비스들이 MongoDB Pod에 접근할 수 있도록 고정된 주소를 제공합니다.
# ===================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: portal-universe
  labels:
    app: mongodb
spec:
  type: ClusterIP # 클러스터 내부에서만 접근 가능한 IP를 할당합니다.
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: mongodb # 'app: mongodb' 레이블을 가진 Pod로 트래픽을 전달합니다.
