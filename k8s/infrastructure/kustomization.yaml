apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Common Config
  - configmap.yaml

  # Databases
  - postgresql.yaml
  - mysql-db.yaml
  - mongodb.yaml

  # Message Queue & Cache
  - kafka.yaml
  - schema-registry.yaml
  - redis.yaml
  - elasticsearch.yaml

  # AWS Local Emulation
  - localstack.yaml

  # Monitoring (Prometheus/Grafana/AlertManager는 Helm으로 관리: k8s/helm/monitoring/)
  - zipkin.yaml

  # Exporters
  - postgres-exporter.yaml
  - kafka-exporter.yaml
  - mysql-exporter.yaml

  # Network & Ingress
  - network-policy.yaml
  - ingress.yaml
  - ingress-zipkin.yaml
