# ===================================================================
# PostgreSQL Exporter for Prometheus
# 7개 DB(auth, shopping, seller, settlement, prism, drive, payment) 메트릭 수집
# ===================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: portal-universe
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.16.0
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: dsn
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: portal-universe
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
      protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: portal-universe
type: Opaque
stringData:
  dsn: "postgresql://postgres_exporter:exporter_pass@postgresql:5432/postgres?sslmode=disable"
