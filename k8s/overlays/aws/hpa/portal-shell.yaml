apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portal-shell-hpa
  namespace: portal-universe
  labels:
    app: portal-shell
    tier: high
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-shell
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
