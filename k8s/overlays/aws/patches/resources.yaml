# AWS 프로덕션 리소스 상향
# Kind 대비 requests/limits 증가

# --- Critical Tier ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: auth-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# --- High Tier ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: shopping-service
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-seller-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: shopping-seller-service
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-shell
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: portal-shell
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
