# Kind 환경 replica 설정
# HPA가 부하에 따라 scale-out. 기본 1 replica로 시작.

# --- 핵심 경로: 기본 1, HPA가 필요 시 scale-out ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: portal-universe
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: portal-universe
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-service
  namespace: portal-universe
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-seller-service
  namespace: portal-universe
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: portal-universe
spec:
  replicas: 1
---
# --- 비핵심 서비스: 1 replica ---
