# Kind 환경 anti-affinity 설정
# Critical Tier: preferredDuringSchedulingIgnoredDuringExecution
# High Tier: preferredDuringSchedulingIgnoredDuringExecution

# --- Critical Tier ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: portal-universe
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
---
