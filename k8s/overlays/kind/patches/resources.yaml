# Kind 환경 리소스 설정
# 부하 테스트 최적화: 핵심 경로에 리소스 집중

# --- Critical Tier ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: auth-service
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
# --- High Tier (부하 테스트 핵심) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: shopping-service
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-seller-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: shopping-seller-service
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: payment-service
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
# --- Minimal Tier ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-shell
  namespace: portal-universe
spec:
  template:
    spec:
      containers:
        - name: portal-shell
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
